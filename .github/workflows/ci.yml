name: Telegram Worker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # 1. VALIDATE
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Wrangler
        run: npx wrangler --version


  # ============================================================
  # 2. TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage


  # ============================================================
  # 3. BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Wrangler configuration check
        run: npx wrangler deploy --dry-run


  # ============================================================
  # 4. DEPLOY
  # ============================================================
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build

    # Recommended:
    # Create a GitHub Environment named "production"
    # and enable required reviewers/protection rules there.
    environment:
      name: production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


  # ============================================================
  # 5. SMOKE TEST
  # ============================================================
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check Worker
        run: |
          set -e

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "${{ secrets.WORKER_URL }}")

          echo "Worker HTTP status: ${STATUS}"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Smoke test failed."
            exit 1
          fi

          echo "Smoke test passed."
